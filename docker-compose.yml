version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Etaalim_db
      POSTGRES_USER: Etaalim_user
      POSTGRES_PASSWORD: Azerty123
    ports:
      - "5432:5432"
    volumes:
      - Etaalim_pgdata:/var/lib/postgresql/data

volumes:
  Etaalim_pgdata: